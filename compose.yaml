name: zoko

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoko
      POSTGRES_USER: zoko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run init and configure .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zoko -d zoko"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 60s
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    build:
      context: .
      target: runtime
    image: zoko:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zoko:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/zoko
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${ZOKO_LOCAL_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 75s
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      ZOKO_DOMAIN: ${ZOKO_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
