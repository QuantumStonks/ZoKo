name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: zoko
          POSTGRES_PASSWORD: zoko_test_only
          POSTGRES_DB: zoko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoko -d zoko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://zoko:zoko_test_only@127.0.0.1:5432/zoko_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: PostgreSQL transactions, concurrency and ledger invariants
        run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Build hardened runtime image
        run: docker build --pull --target runtime --tag zoko:ci .
      - name: Run production image against PostgreSQL
        run: node scripts/smoke-runtime.mjs
